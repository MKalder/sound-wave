<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Wave - Studio Rent</title>
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <link rel="stylesheet" href="./assets/styles/navbar.css" />
    <link rel="stylesheet" href="./assets/styles/hero.css" />
  </head>
  <body>
    <header>
      <div class="header-nav">
        <img
          id="brand-header"
          src="./assets/svg/brandlogo-headsvg.svg"
          alt="Sound Wave logo"
        />
        <nav>
          <ul class="menu">
            <li><a href="#">Studios</a></li>
            <li><a href="#">Explore</a></li>
            <li><a href="#">Community</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">About</a></li>
          </ul>
        </nav>
        <a class="login" href="">Login</a>
        <a class="cta-book" href="">Book</a>
      </div>
    </header>

    <section class="hero">
      <div class="wording item">
        <div class="headline">
          <span class="connect">CONNECT.</span>
          <span class="create">CREATE.</span>
          <span class="record">RECORD.</span>
        </div>
        <p>
          Find music studios, collaborate with producers, and bring your sound
          to life — anywhere in the world.
        </p>
      </div>
      <div class="carousel item">
         <button class="nav prev">
          <svg viewBox="0 0 24 24" width="32">
            <path
              d="M15 18l-6-6 6-6"
              stroke="white"
              fill="none"
              stroke-width="2"
            />
          </svg>
        </button>
        <div class="carousel__track">
          
          <div class="slide">
            <img src="./assets/images/carousel/two.png" />
          </div>
          <div class="slide">
            <img src="./assets/images/carousel/two.png" />
          </div>
          <div class="slide">
            <img src="./assets/images/carousel/two.png" />
          </div>
          <div class="slide">
            <img src="./assets/images/carousel/two.png" />
          </div>
          
        </div>
         <button class="nav next">
            <svg viewBox="0 0 24 24" width="32" style="transform: scaleX(-1)">
              <path
                d="M15 18l-6-6 6-6"
                stroke="white"
                fill="none"
                stroke-width="2"
              />
            </svg>
       
      </div>
    </section>
    <section class="latest-studios"></section>
    <section class="sucess-story"></section>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
